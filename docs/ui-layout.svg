<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" width="940" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="940" height="780" rx="18" fill="#0d0e15"/>

  <!-- 手机外框 -->
  <rect x="60" y="34" width="380" height="712" rx="34" fill="#0b0c12" stroke="#2a2d3f" stroke-width="2"/>
  <rect x="86" y="62" width="328" height="656" rx="18" fill="#12131d"/>

  <!-- ① 状态栏 -->
  <rect x="86" y="62" width="328" height="44" rx="18" fill="#171822"/>
  <circle cx="110" cy="84" r="5" fill="#2fbf71"/>
  <text x="124" y="89" font-size="12" fill="#8a90a0">MY-PC</text>
  <rect x="252" y="72" width="92" height="24" rx="12" fill="#1e2030" stroke="#2fbf71" opacity="0.9"/>
  <text x="298" y="89" font-size="11" fill="#b5f7cd" text-anchor="middle">扩展已连接</text>
  <text x="386" y="89" font-size="11" fill="#8a90a0" text-anchor="end">🔊 45%</text>
  <circle cx="98" cy="84" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="98" y="88" font-size="10" fill="#cfc7ff" text-anchor="middle">1</text>

  <!-- ② 模式行 -->
  <rect x="96" y="116" width="88" height="26" rx="13" fill="#1c1e30" stroke="#6c5ce7" opacity="0.85"/>
  <text x="140" y="133" font-size="11.5" fill="#cfc7ff" text-anchor="middle">▶ 播放控制</text>
  <text x="196" y="133" font-size="12.5" fill="#e9eaf2">【番剧】视频标题…</text>
  <circle cx="88" cy="129" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="88" y="133" font-size="10" fill="#cfc7ff" text-anchor="middle">2</text>

  <!-- ③ 进度条 -->
  <rect x="96" y="154" width="308" height="14" rx="7" fill="#0f1017"/>
  <rect x="96" y="159" width="308" height="4" rx="2" fill="#1e2030"/>
  <rect x="96" y="159" width="132" height="4" rx="2" fill="#6c5ce7"/>
  <circle cx="228" cy="161" r="7" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="404" y="152" font-size="10.5" fill="#6f7488" text-anchor="end">12:30 / 24:00</text>
  <circle cx="88" cy="161" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="88" y="165" font-size="10" fill="#cfc7ff" text-anchor="middle">3</text>

  <!-- ④ 角落小键 -->
  <rect x="112" y="196" width="56" height="56" rx="12" fill="#1e2030" stroke="#33375a" stroke-dasharray="4 3"/>
  <text x="140" y="231" font-size="15" fill="#8a90a0" text-anchor="middle">⛶</text>
  <rect x="332" y="196" width="56" height="56" rx="12" fill="#1e2030" stroke="#33375a" stroke-dasharray="4 3"/>
  <text x="360" y="231" font-size="15" fill="#8a90a0" text-anchor="middle">🔄</text>
  <circle cx="100" cy="206" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="100" y="210" font-size="10" fill="#cfc7ff" text-anchor="middle">4</text>
  <text x="250" y="214" font-size="10" fill="#6f7488" text-anchor="middle">比方向键小 · 按语义显隐</text>

  <!-- ⑤ 方向五键 -->
  <rect x="172" y="196" width="88" height="88" rx="18" fill="#171822" stroke="#262a3a"/>
  <text x="216" y="252" font-size="26" fill="#e9eaf2" text-anchor="middle">▲</text>
  <rect x="112" y="296" width="88" height="88" rx="18" fill="#171822" stroke="#262a3a"/>
  <text x="156" y="352" font-size="26" fill="#e9eaf2" text-anchor="middle">◀</text>
  <rect x="212" y="296" width="88" height="88" rx="18" fill="#6c5ce7"/>
  <text x="256" y="350" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">OK</text>
  <rect x="312" y="296" width="88" height="88" rx="18" fill="#171822" stroke="#262a3a"/>
  <text x="356" y="352" font-size="26" fill="#e9eaf2" text-anchor="middle">▶</text>
  <rect x="172" y="396" width="88" height="88" rx="18" fill="#171822" stroke="#262a3a"/>
  <text x="216" y="452" font-size="26" fill="#e9eaf2" text-anchor="middle">▼</text>
  <circle cx="100" cy="240" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="100" y="244" font-size="10" fill="#cfc7ff" text-anchor="middle">5</text>
  <text x="216" y="510" font-size="10.5" fill="#6f7488" text-anchor="middle">长按 ◀▶ = 2 倍速</text>

  <!-- ⑥ 返回键 -->
  <rect x="156" y="530" width="200" height="50" rx="15" fill="#1e2030" stroke="#262a3a"/>
  <text x="256" y="562" font-size="15" fill="#e9eaf2" text-anchor="middle">↩ 返回</text>
  <circle cx="140" cy="548" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="140" y="552" font-size="10" fill="#cfc7ff" text-anchor="middle">6</text>

  <!-- ⑦ 提示行 -->
  <text x="256" y="620" font-size="11.5" fill="#8a90a0" text-anchor="middle">◀▶ 快退/快进 · 长按2x  ▲▼ 音量 · OK 播放暂停 · ↩ 退出</text>
  <circle cx="140" cy="616" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="140" y="620" font-size="10" fill="#cfc7ff" text-anchor="middle">7</text>

  <!-- ⑧ 更多工具 -->
  <rect x="106" y="652" width="288" height="46" rx="13" fill="#171822" stroke="#262a3a"/>
  <text x="250" y="681" font-size="13" fill="#8a90a0" text-anchor="middle">••• 更多工具（触摸板 · 键盘 · 宏 · 音量滑杆 · 设置）</text>
  <circle cx="90" cy="672" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/>
  <text x="90" y="676" font-size="10" fill="#cfc7ff" text-anchor="middle">8</text>

  <!-- 图例 -->
  <text x="490" y="72" font-size="19" font-weight="700" fill="#e9eaf2">手机端布局（示意）</text>
  <text x="490" y="98" font-size="12.5" fill="#8a90a0">按键语义随页面形态自动切换，角落小键只在该语义下出现</text>

  <g font-size="13" fill="#b9bdcc">
    <text x="516" y="150">状态栏：连接状态 · 设备名 · 扩展状态 · 音量</text>
    <text x="516" y="200">模式芯片 + 当前视频标题（视频 / 信息流 / 网格）</text>
    <text x="516" y="250">进度条：拖动任意位置跳转（有播放时长时出现圆点）</text>
    <text x="516" y="300">角落小键：全屏（视频语义）/ 换一换（网格语义）</text>
    <text x="516" y="350">方向五键：◀▶ 快退快进 · 长按 2x；▲▼ 音量 / 切条；OK 播放或打开</text>
    <text x="516" y="400">返回键：退选择 / 关浮层 / 关播放标签</text>
    <text x="516" y="450">提示行：随时说明当前按键语义</text>
    <text x="516" y="500">更多工具：触摸板 · 键盘 · 快捷宏 · 音量滑杆 · 设置</text>
  </g>
  <g>
    <circle cx="498" cy="145" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="149" font-size="10" fill="#cfc7ff" text-anchor="middle">1</text>
    <circle cx="498" cy="195" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="199" font-size="10" fill="#cfc7ff" text-anchor="middle">2</text>
    <circle cx="498" cy="245" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="249" font-size="10" fill="#cfc7ff" text-anchor="middle">3</text>
    <circle cx="498" cy="295" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="299" font-size="10" fill="#cfc7ff" text-anchor="middle">4</text>
    <circle cx="498" cy="345" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="349" font-size="10" fill="#cfc7ff" text-anchor="middle">5</text>
    <circle cx="498" cy="395" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="399" font-size="10" fill="#cfc7ff" text-anchor="middle">6</text>
    <circle cx="498" cy="445" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="449" font-size="10" fill="#cfc7ff" text-anchor="middle">7</text>
    <circle cx="498" cy="495" r="9" fill="none" stroke="#6c5ce7" stroke-width="1.6"/><text x="498" y="499" font-size="10" fill="#cfc7ff" text-anchor="middle">8</text>
  </g>

  <rect x="490" y="546" width="410" height="180" rx="12" fill="#12131f" stroke="#232638"/>
  <text x="512" y="576" font-size="13" font-weight="700" fill="#cfc7ff">说明</text>
  <text x="512" y="602" font-size="12" fill="#b9bdcc">· 上图为布局示意图（wireframe），不是界面截图</text>
  <text x="512" y="626" font-size="12" fill="#b9bdcc">· 全屏与主题色为深色，实际为响应式布局，最大宽度 560px</text>
  <text x="512" y="650" font-size="12" fill="#b9bdcc">· 触摸板在「更多工具」内，支持单指移动 / 轻点 / 双指滚动</text>
  <text x="512" y="674" font-size="12" fill="#b9bdcc">· 未开浏览器时，OK 键直接打开 B 站</text>
  <text x="512" y="698" font-size="12" fill="#b9bdcc">· 支持「添加到主屏幕」作为 PWA 使用</text>
</svg>
